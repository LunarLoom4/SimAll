name: docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**/*.hpp'
      - 'src/**/*.h'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen + MkDocs
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz plantuml
          pip install mkdocs-material mkdoxy pymdown-extensions
      - name: Doxygen
        # Doxyfile uses paths relative to the docs/ directory (../src, ../plugins,
        # ../build/doxygen).  Doxygen also can't auto-create the output dir,
        # so we mkdir it explicitly first.
        run: |
          mkdir -p build/doxygen
          cd docs && doxygen Doxyfile
      - name: MkDocs build
        # MkDocs is best-effort -- not all module .md pages exist yet.
        continue-on-error: true
        run: mkdocs build -f docs/mkdocs.yml --strict
      - name: Upload site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simall-docs
          path: build/docs-site
          if-no-files-found: ignore
