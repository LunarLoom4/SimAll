name: docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/**/*.hpp'
      - 'src/**/*.h'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen + MkDocs
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz plantuml
          pip install mkdocs-material mkdoxy pymdown-extensions
      - name: Doxygen
        run: doxygen docs/Doxyfile
      - name: MkDocs build
        run: mkdocs build -f docs/mkdocs.yml --strict
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: simall-docs
          path: build/docs-site
